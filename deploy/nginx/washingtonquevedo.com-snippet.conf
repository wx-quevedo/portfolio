# Included by the washingtonquevedo.com site (server context). Rewritten on every deploy: the
# placeholder in script-src becomes the sha256 hashes of that build's inline scripts (scripts/csp-hashes.mjs).
# The same lines are read by scripts/serve-dist.mjs to check the site locally with these headers.

add_header Cache-Control $wq_cache_control always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), browsing-topics=()" always;
# script-src: own files, the inline scripts of this build (hashes) and WebAssembly compilation for
# onnxruntime-web. worker-src: the detector worker. frame-src: the Ask Washington chat. WebGPU needs no CSP entry.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval' __SCRIPT_HASHES__; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; worker-src 'self' blob:; frame-src https://ask.inmersoft.com; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests" always;

# Compression: the build ships .gz files (scripts/precompress.mjs); anything else is gzipped on the fly.
gzip on;
gzip_static on;
gzip_vary on;
gzip_comp_level 5;
gzip_min_length 1024;
gzip_types text/css application/javascript text/javascript application/json image/svg+xml application/wasm application/octet-stream text/plain application/xml;
