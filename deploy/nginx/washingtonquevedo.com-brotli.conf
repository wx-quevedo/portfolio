# Appended to the snippet only when the nginx brotli module is already installed on the server
# (remote-deploy.sh checks; nothing is installed). The build ships .br files for brotli_static.
brotli on;
brotli_static on;
brotli_comp_level 5;
brotli_types text/css application/javascript text/javascript application/json image/svg+xml application/wasm application/octet-stream text/plain application/xml;
