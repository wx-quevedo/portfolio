# nginx site for washingtonquevedo.com (static Astro build).
# Installed by deploy/remote-deploy.sh as /etc/nginx/sites-available/washingtonquevedo.com and
# kept afterwards (certbot --nginx adds the HTTPS block and the HTTP -> HTTPS redirect to it);
# replace it with deploy.ps1 -ForceNginx. Headers, CSP and compression are in
# /etc/nginx/snippets/washingtonquevedo.com.conf, which every deploy rewrites.

# Cache policy by path. Files in sites-enabled are included inside http {}, where map is allowed.
map $uri $wq_cache_control {
    default                "public, max-age=0, must-revalidate";
    ~^/_astro/             "public, max-age=31536000, immutable";
    ~^/models/             "public, max-age=31536000, immutable";
    ~^/fonts/              "public, max-age=2592000";
    ~^/detector/examples/  "public, max-age=2592000";
}

server {
    listen 80;
    listen [::]:80;
    server_name washingtonquevedo.com www.washingtonquevedo.com;

    # www -> apex with 301 (this block becomes the HTTPS one after certbot, so it applies there too).
    if ($host = www.washingtonquevedo.com) {
        return 301 https://washingtonquevedo.com$request_uri;
    }

    root /var/www/washingtonquevedo.com/current;
    index index.html;
    charset utf-8;
    server_tokens off;

    include /etc/nginx/snippets/washingtonquevedo.com.conf;

    # No location below uses add_header, so every response keeps the headers of the snippet.
    location / {
        try_files $uri $uri/ $uri.html =404;
    }
    location ~* \.wasm$ {
        types { }
        default_type application/wasm;
    }
    location ~* \.onnx$ {
        types { }
        default_type application/octet-stream;
    }

    error_page 404 /404.html;
}
